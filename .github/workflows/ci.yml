name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: true

      - name: Run tests with coverage
        run: make coverage

      - name: Check style
        run: make check-style

      - name: Install linter
        run: GOBIN="$GITHUB_WORKSPACE/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0

      - name: Run linter
        env:
          GOLANGCI_LINT: ${{ github.workspace }}/bin/golangci-lint
        run: make lint

      - name: Install vulnerability scanner
        run: GOBIN="$GITHUB_WORKSPACE/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan release binaries
        env:
          GOVULNCHECK: ${{ github.workspace }}/bin/govulncheck
        run: make security

      - name: Build and inspect bundle
        run: |
          RELEASE_VERSION=0.2.1
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then RELEASE_VERSION="${GITHUB_REF_NAME#v}"; fi
          make PLUGIN_VERSION="$RELEASE_VERSION" bundle
          test "$(tar -xOzf "dist/com.github.crypt0rr.default-theme-${RELEASE_VERSION}.tar.gz" "com.github.crypt0rr.default-theme/plugin.json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')" = "$RELEASE_VERSION"
          test "$(tar -tzf "dist/com.github.crypt0rr.default-theme-${RELEASE_VERSION}.tar.gz" | grep -c 'server/dist/plugin-')" = "5"
          test "$(jq -r '.settings_schema.settings[] | select(.key == "DefaultTheme") | .type' plugin.json)" = "longtext"
          test "$(jq -r '.settings_schema.sections[] | select(.key == "PerUserTheme") | .settings[] | select(.key == "TargetUsername") | .type' plugin.json)" = "username"
          test "$(jq -r '.settings_schema.sections[] | select(.key == "PerUserTheme") | .settings[] | select(.key == "TargetTheme") | .type' plugin.json)" = "longtext"

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"

      - name: Upload bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-plugin-default-theme-${{ github.ref_name }}
          path: dist/com.github.crypt0rr.default-theme-*.tar.gz

      - name: Create release checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum dist/com.github.crypt0rr.default-theme-*.tar.gz > dist/com.github.crypt0rr.default-theme-${GITHUB_REF_NAME#v}.tar.gz.sha256

      - name: Upload checksum
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-plugin-default-theme-${{ github.ref_name }}-checksum
          path: dist/*.sha256

  smoke:
    name: Team Edition smoke (${{ matrix.version }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version:
          - 11.7.0
          - 11.8.5
          - 11.9.1
          - 11.10.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: true

      - name: Build plugin bundle
        run: make bundle

      - name: Run Team Edition smoke test
        env:
          MM_VERSIONS: ${{ matrix.version }}
        run: bash scripts/docker-smoke-matrix.sh

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: mattermost-plugin-default-theme-${{ github.ref_name }}
          path: dist

      - name: Download checksum
        uses: actions/download-artifact@v4
        with:
          name: mattermost-plugin-default-theme-${{ github.ref_name }}-checksum
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
